<script>
const LEVEL_TEXT = { red: "อันตรายมาก · กำลังระบาดวงกว้าง", yellow: "อันตรายปานกลาง · กำลังควบคุม", green: "ควบคุมได้แล้ว / เฝ้าระวัง" };
const FILL = { red: "#ff5d6c", yellow: "#f0c14a", green: "#3ee0a2" };
const SEV = { nipah:45, rabies:42, mers:34, avian:30, measles:28, cholera:24, malaria:22, je:20, dengue:18, lepto:16, mpox:16, covid:14, flu:12, hfmd:10, chik:10 };
let selected = null, status = "all", query = "", spotId = null, map, layer, mode = "";

function diseaseOf(id) { return DATA.DISEASES.find((d) => d.id === id); }
function fmtCount(text) { return /\d/.test(String(text || "")) ? text : "ยังไม่สามารถระบุได้"; }
function parseNum(text) { const m = String(text).replace(/,/g, "").match(/\d+/); return m ? Number(m[0]) : 0; }
function esc(v) { return String(v).replace(/[&<>]/g, (c) => ({ "&":"&", "<":"<", ">":">" }[c])); }
function mainLevel(id) {
  const rows = DATA.SPOTS.filter((s) => s.disease === id);
  if (rows.some((r) => r.level === "red")) return "red";
  if (rows.some((r) => r.level === "yellow")) return "yellow";
  return "green";
}
function spreadOf(id) {
  const rows = DATA.SPOTS.filter((s) => s.disease === id);
  const countries = [...new Set(rows.map((s) => s.country))];
  const red = rows.filter((s) => s.level === "red");
  const yellow = rows.filter((s) => s.level === "yellow");
  const green = rows.filter((s) => s.level === "green");
  const active = rows.filter((s) => s.status.includes("กำลัง")).length;
  const score = Math.min(100, red.length * 18 + yellow.length * 8 + countries.length * 6 + (active > 3 ? 10 : 0));
  let phase = "จำกัดวง";
  if (red.length >= 4 || countries.length >= 6) phase = "แพร่หลายประเทศ วงกว้าง";
  else if (red.length >= 1 || countries.length >= 3) phase = "หลายพื้นที่ ยังควบคุมบางจุดได้";
  else if (green.length === rows.length) phase = "ควบคุมได้แล้ว เหลือเฝ้าระวัง";
  return { rows, countries, red, yellow, green, active, score, phase, meta: DATA.SPREAD[id] };
}
function riskOf(id) {
  const spread = spreadOf(id);
  const deaths = spread.rows.reduce((n, s) => n + parseNum(s.deaths), 0);
  const score = Math.min(100, (SEV[id] || 15) + spread.red.length * 12 + spread.yellow.length * 6 + Math.min(20, spread.countries.length * 2));
  const band = score >= 70 ? "สูง" : score >= 40 ? "ปานกลาง" : "ต่ำ";
  return { score, band, deaths, meta: DATA.RISK[id], spread };
}
function tally(spots, key) {
  let sum = 0, clean = 0, missing = 0;
  for (const spot of spots) {
    const text = String(spot[key] || "").trim();
    if (/^[\d,]+$/.test(text)) { sum += Number(text.replace(/,/g, "")); clean++; }
    else missing++;
  }
  if (!clean) return "ยังไม่สามารถระบุได้";
  const shown = sum.toLocaleString("en-US");
  return missing ? shown + " · บางจุดยังไม่สามารถระบุได้" : shown;
}
function analyze(q) {
  const low = q.toLowerCase();
  const hit = DATA.DISEASES.find((d) => low.includes(d.name) || low.includes(d.en.toLowerCase()) || (d.id === "dengue" && low.includes("เลือดออก")) || (d.id === "cholera" && (low.includes("อหิวา") || low.includes("ท้องร่วง"))) || (d.id === "mpox" && low.includes("ฝีดาษ")));
  if (!q || low.includes("สรุป") || low.includes("ภาพรวม")) {
    const red = DATA.SPOTS.filter((s) => s.level === "red").length;
    const yellow = DATA.SPOTS.filter((s) => s.level === "yellow").length;
    const green = DATA.SPOTS.filter((s) => s.level === "green").length;
    return "อ่านชุดข้อมูล ณ " + DATA.DATA_AS_OF + "\nจุดเฝ้าระวัง " + DATA.SPOTS.length + " จุด · แดง " + red + " · เหลือง " + yellow + " · เขียว " + green;
  }
  if (low.includes("เสี่ยง")) {
    const target = hit || diseaseOf(selected || "dengue");
    const r = riskOf(target.id);
    return "วิเคราะห์ความเสี่ยง " + target.name + "\nระดับ" + r.band + " ดัชนี " + r.score + "/100\n" + r.meta.cfr + "\nไทย: " + r.meta.th;
  }
  if (low.includes("แพร่") || low.includes("วิเคราะห์")) {
    const target = hit || diseaseOf(selected || "dengue");
    const a = spreadOf(target.id);
    return "วิเคราะห์การแพร่ " + target.name + "\nระยะ: " + a.phase + "\nประเทศ " + a.countries.join(", ") + "\nจุดเริ่ม: " + a.meta.origin;
  }
  if (hit) {
    const lines = DATA.SPOTS.filter((s) => s.disease === hit.id).map((s) => "· " + s.country + " " + s.admin + ": " + s.status + ", ติดเชื้อ " + fmtCount(s.cases) + ", เสียชีวิต " + fmtCount(s.deaths));
    return hit.name + "\n" + hit.agent + "\n\n" + lines.join("\n");
  }
  return "ลองถามว่า สรุปภาพรวม, ความเสี่ยง, การแพร่, ไข้เลือดออก หรือ นิปาห์";
}
function popupHtml(spot) {
  const d = diseaseOf(spot.disease);
  const list = (title, items) => '<div style="color:#7ad7ff;margin-top:6px">' + esc(title) + "</div><ul>" + items.slice(0, 3).map((item) => "<li>" + esc(item) + "</li>").join("") + "</ul>";
  return "<b>" + esc(d.name) + "</b><br>" + esc(spot.country) + " · " + esc(spot.admin) + '<br><span style="color:' + FILL[spot.level] + '">' + esc(LEVEL_TEXT[spot.level]) + "</span> · " + esc(spot.status) + "<br>ผู้ติดเชื้อ: " + esc(fmtCount(spot.cases)) + "<br>ผู้เสียชีวิต: " + esc(fmtCount(spot.deaths)) + "<br>รักษาหาย: ยังไม่สามารถระบุได้<br>" + list("อาการ", d.symptoms) + list("อาการเสี่ยง", d.risk) + list("แนวทางรักษา", d.treat) + list("แนวทางป้องกัน", d.prevent);
}
function visibleSpots() {
  if (!selected) return [];
  const q = query.trim().toLowerCase();
  return DATA.SPOTS.filter((spot) => {
    if (spot.disease !== selected) return false;
    if (status === "now" && !spot.status.includes("กำลัง")) return false;
    if (status === "past" && !spot.status.includes("เคย")) return false;
    if (!q) return true;
    const d = diseaseOf(spot.disease);
    return (spot.country + " " + spot.admin + " " + d.name).toLowerCase().includes(q);
  });
}
function draw() {
  if (!map || !layer) return;
  layer.clearLayers();
  const spots = visibleSpots();
  if (!selected) {
    const groups = new Map();
    for (const spot of DATA.SPOTS) {
      if (!spot.status.includes("กำลัง")) continue;
      const g = groups.get(spot.country) || { country: spot.country, lat: 0, lng: 0, n: 0, level: "green", names: [] };
      g.lat += spot.lat; g.lng += spot.lng; g.n++;
      if (spot.level === "red" || (spot.level === "yellow" && g.level !== "red")) g.level = spot.level;
      const name = diseaseOf(spot.disease).name;
      if (!g.names.includes(name)) g.names.push(name);
      groups.set(spot.country, g);
    }
    for (const g of groups.values()) {
      const shortName = g.country.length <= 12 ? '<div class="cname sm">' + esc(g.country) + "</div>" : "";
      L.marker([g.lat / g.n, g.lng / g.n], {
        icon: L.divIcon({ className: "", html: '<div class="map-col"><div class="dot ' + g.level + '"></div>' + shortName + "</div>", iconSize: [72, 34], iconAnchor: [36, 8] }),
        zIndexOffset: g.level === "red" ? 400 : 200
      }).bindPopup("<b>" + esc(g.country) + "</b><br>การระบาดล่าสุด<br>" + g.names.map(esc).join("<br>")).addTo(layer);
    }
  } else {
    const used = {};
    spots.forEach((spot) => {
      const key = spot.lat.toFixed(1) + "," + spot.lng.toFixed(1);
      const n = used[key] || 0; used[key] = n + 1;
      const ang = n * 0.9, dist = n === 0 ? 0 : 0.35 + n * 0.12;
      const lat = spot.lat + Math.sin(ang) * dist, lng = spot.lng + Math.cos(ang) * dist;
      const marker = L.marker([lat, lng], { zIndexOffset: spot.level === "red" ? 500 : 100, icon: L.divIcon({ className: "", html: '<div class="dot ' + spot.level + '"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) });
      marker.bindPopup(popupHtml(spot));
      marker.on("click", () => { spotId = spot.id; render(); });
      marker.addTo(layer);
    });
  }
  const next = selected || "overview";
  if (mode !== next) {
    mode = next;
    if (!selected) map.setView([22, 100], 4);
    else if (spots.length) map.fitBounds(spots.map((s) => [s.lat, s.lng]), { padding: [40, 40], maxZoom: 5 });
  }
}
function render() {
  const q = query.trim().toLowerCase();
  const menu = DATA.DISEASES.filter((d) => !q || (d.name + " " + d.en).toLowerCase().includes(q) || DATA.SPOTS.some((s) => s.disease === d.id && (s.country + " " + s.admin).toLowerCase().includes(q)));
  const focus = DATA.SPOTS.find((s) => s.id === spotId) || null;
  const spots = visibleSpots();
  const counted = focus ? [focus] : spots.length ? spots : DATA.SPOTS.filter((s) => s.status.includes("กำลัง"));
  const disease = selected ? diseaseOf(selected) : focus ? diseaseOf(focus.disease) : null;
  const spread = disease ? spreadOf(disease.id) : null;
  const risk = disease ? riskOf(disease.id) : null;
  const ring = risk ? risk.score : Math.min(100, DATA.SPOTS.filter((s) => s.level === "red").length * 8);
  const timeline = disease && DATA.TIMELINES[disease.id] ? DATA.TIMELINES[disease.id].slice(0, 3) : [];
  const fact = (title, items) => '<div class="hud-fact"><h3 class="text-xs text-accent">' + title + "</h3>" + (items ? "<ul>" + items.map((i) => "<li>" + esc(i) + "</li>").join("") + "</ul>" : '<p class="text-xs text-muted">เลือกโรคทางซ้าย หรือกดจุดบนแผนที่</p>') + "</div>";
  document.getElementById("app").innerHTML =
    '<div class="hud-page"><header class="hud-kicker"><span class="hud-index">01</span><div><h1>เอเชียเฝ้าระวัง</h1><p>ASIA OUTBREAK OVERVIEW</p></div>' +
    '<input id="q" class="border-line" style="margin-left:auto;width:min(240px,40vw);background:var(--color-panel);color:inherit;border:1px solid var(--color-line);padding:6px 10px" placeholder="ค้นประเทศ จังหวัด หรือโรค" value="' + esc(query) + '" />' +
    '<p class="text-xs text-muted" style="text-align:right">ชุดข้อมูลสาธารณะ<br><b class="text-accent">' + esc(DATA.DATA_AS_OF) + "</b></p></header>" +
    '<div class="hud-screen"><div class="hud-bar"><span class="text-sm text-accent">แผนที่โรคระบาดทั่วทวีปเอเชีย</span></div><div class="hud-body">' +
    '<aside class="hud-side hud-side-l"><button data-id="" class="hud-item ' + (selected ? "" : "on") + '">ภาพรวมล่าสุด</button>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px 8px"><button data-status="now" class="text-xs" style="border:1px solid var(--color-line);background:transparent;color:inherit">กำลังเกิด</button><button data-status="past" class="text-xs" style="border:1px solid var(--color-line);background:transparent;color:inherit">เคยเกิด</button></div>' +
    menu.map((item) => '<button data-id="' + item.id + '" class="hud-item ' + (selected === item.id ? "on" : "") + '"><span class="' + (mainLevel(item.id) === "red" ? "bg-danger" : mainLevel(item.id) === "yellow" ? "bg-warn" : "bg-ok") + '" style="width:6px;height:6px;border-radius:99px"></span><span>' + esc(item.name) + "</span></button>").join("") +
    '</aside><div class="relative" style="position:relative;min-height:240px"><div id="map" style="position:absolute;inset:0"></div><div class="hud-mapveil"></div></div>' +
    '<aside class="hud-side hud-side-r" style="padding:12px"><p class="text-xs text-accent">ตัวเลขในมุมมองนี้</p><div style="display:flex;gap:12px;align-items:center;margin-top:8px"><div class="hud-ring" style="background:conic-gradient(var(--color-accent) ' + (ring * 3.6) + 'deg, rgba(90,160,200,.16) 0)"><span>' + ring + '</span></div><div><h2 class="text-sm">' + esc(disease ? disease.name : "การระบาดที่กำลังเกิด") + "</h2></div></div>" +
    '<div style="margin-top:12px"><div style="border:1px solid var(--color-line);padding:8px 12px"><p class="text-xs text-muted">ผู้ติดเชื้อ</p><p class="text-accent" style="font-size:20px">' + esc(tally(counted, "cases")) + "</p></div>" +
    '<div style="border:1px solid var(--color-line);padding:8px 12px;margin-top:8px"><p class="text-xs text-muted">ผู้เสียชีวิต</p><p class="text-accent" style="font-size:20px">' + esc(tally(counted, "deaths")) + "</p></div>" +
    '<div style="border:1px solid var(--color-line);padding:8px 12px;margin-top:8px"><p class="text-xs text-muted">รักษาหาย</p><p class="text-accent" style="font-size:20px">ยังไม่สามารถระบุได้</p></div></div>' +
    (spread ? '<p class="text-xs text-muted" style="margin-top:8px">การแพร่: ' + esc(spread.phase) + "</p>" : "") +
    timeline.map((row) => '<p class="text-xs text-muted"><b class="text-ink">' + esc(row[0]) + "</b> " + esc(row[1]) + "</p>").join("") +
    '<form id="ask" style="display:flex;gap:4px;margin-top:8px"><input id="question" style="flex:1;background:var(--color-bg);color:inherit;border:1px solid var(--color-line);padding:6px" placeholder="ถามจำนวนหรือเชื้อใหม่" /><button class="text-sm text-accent" style="border:1px solid var(--color-accent);background:transparent">ถาม</button></form><p id="answer" class="text-xs text-muted" style="white-space:pre-wrap"></p></aside></div>' +
    '<section class="hud-facts">' + fact("อาการของผู้ติดเชื้อ", disease && disease.symptoms) + fact("อาการเสี่ยง", disease && disease.risk) + fact("แนวทางรักษา", disease && disease.treat) + fact("แนวทางป้องกัน", disease && disease.prevent) + "</section></div></div>";
  document.querySelectorAll("[data-id]").forEach((btn) => btn.onclick = () => { selected = btn.dataset.id || null; spotId = null; render(); });
  document.querySelector("[data-status=now]").onclick = () => { status = status === "now" ? "all" : "now"; render(); };
  document.querySelector("[data-status=past]").onclick = () => { status = status === "past" ? "all" : "past"; render(); };
  const input = document.getElementById("q");
  input.oninput = (e) => { query = e.target.value; const pos = e.target.selectionStart; render(); const again = document.getElementById("q"); again.focus(); again.setSelectionRange(pos, pos); };
  document.getElementById("ask").onsubmit = (e) => { e.preventDefault(); document.getElementById("answer").textContent = analyze(document.getElementById("question").value); };
  const node = document.getElementById("map");
  if (!map) {
    map = L.map(node, { zoomControl: true, minZoom: 3, maxZoom: 8, maxBounds: [[-25, 15], [62, 160]], maxBoundsViscosity: 0.8 }).setView([22, 100], 4);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { attribution: "แผนที่ Esri", maxZoom: 16 }).addTo(map);
    layer = L.layerGroup().addTo(map);
  } else {
    map.invalidateSize();
  }
  draw();
}
render();
</script>
</body>
</html>
